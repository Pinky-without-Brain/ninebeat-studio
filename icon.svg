<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </radialGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00aa00"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Hardware Chassis -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#2d3748" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#171923" stroke-width="4"/>

  <!-- Inset Hardware Groove -->
  <rect x="48" y="48" width="416" height="416" rx="60" fill="#0d1017" stroke="#252a36" stroke-width="4"/>

  <!-- Ninebeat '9' & Wave Graphic -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- 909 Circle -->
    <circle cx="156" cy="110" r="70" fill="none" stroke="url(#amberGlow)" stroke-width="28" stroke-linecap="round"/>
    <!-- 9 Tail descending -->
    <path d="M 226,110 L 226,200 A 70,70 0 0 1 120,260" fill="none" stroke="url(#amberGlow)" stroke-width="28" stroke-linecap="round"/>

    <!-- Acid Wave (303) -->
    <path d="M 40,240 Q 75,180 110,240 T 180,240" fill="none" stroke="url(#limeGlow)" stroke-width="12" stroke-linecap="round"/>

    <!-- Sampler Pad Matrix Accent (Cyan) -->
    <rect x="220" y="20" width="24" height="24" rx="4" fill="url(#cyanGlow)"/>
    <rect x="250" y="20" width="24" height="24" rx="4" fill="url(#cyanGlow)" opacity="0.6"/>
  </g>

  <!-- Screws in corners -->
  <circle cx="64" cy="64" r="8" fill="#4a5568"/>
  <circle cx="448" cy="64" r="8" fill="#4a5568"/>
  <circle cx="64" cy="448" r="8" fill="#4a5568"/>
  <circle cx="448" cy="448" r="8" fill="#4a5568"/>
</svg>
