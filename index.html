<!DOCTYPE html>
<html lang="de" class="h-full bg-hw-darkest select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Match the default theme's scheme. Since 27.09.2026 (user decision)
         the default theme is ATELIER (light) instead of NEON NOIR (dark) -
         "default" is the light-content iOS status bar style, kept in sync
         with the inline script below and src/theme/registry.ts. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ninebeat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ATELIER's ThemeDefinition.metaThemeColor - see theme-color note above. -->
    <meta name="theme-color" content="#ECEEF1" />
    <script>
      // Applies the saved theme (if any) before first paint, so the app
      // never flashes ATELIER (the default as of 27.09.2026, user decision)
      // and then jumps to a different theme once React mounts. Mirrors
      // src/theme/runtime.ts#applyTheme, but can't import it (this runs
      // before any module loads) - kept deliberately tiny and defensive: a
      // bad/missing value must never block the page.
      // Must run after the meta tags above (it looks them up and may
      // override them).
      //
      // Before 27.09.2026 the default was NEON NOIR (dark), so this script
      // only had to branch ONE way: override the static dark tags to light
      // ones when a light theme was saved. Now that the static tags above
      // already assume the light default, it must branch BOTH ways: also
      // restore the dark values when a dark theme (NEON NOIR, ELEMENTS) is
      // saved. Kept in sync with src/theme/registry.ts's THEMES by
      // tests/smoke.mjs section [36] ("scheme" field, "metaThemeColor" field).
      (function () {
        try {
          var LIGHT_SCHEME_THEME_IDS = ['atelier'];
          var THEME_COLORS = { 'neon-noir': '#090a0d', atelier: '#ECEEF1', elements: '#090a0d' };

          var raw = localStorage.getItem('ninebeat.settings.v1');
          if (!raw) return;
          var data = JSON.parse(raw);
          // Nur ein bewusst gewaehltes Theme zaehlt (`general.themeChosen`,
          // Befund vom 30.09.2026): der Speicherstand traegt sonst auch das
          // Theme, das nur die Vorgabe war, und wiederkehrende Nutzer
          // blieben dunkel, obwohl ATELIER die Vorgabe ist.
          if (!data || !data.general || data.general.themeChosen !== true) return;
          var id = data.general.theme;
          if (typeof id !== 'string' || !/^[a-z0-9-]{1,32}$/.test(id)) return;
          document.documentElement.setAttribute('data-theme', id);

          var isLight = LIGHT_SCHEME_THEME_IDS.indexOf(id) !== -1;
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (bar) bar.setAttribute('content', isLight ? 'default' : 'black-translucent');
          var color = document.querySelector('meta[name="theme-color"]');
          if (color && THEME_COLORS[id]) color.setAttribute('content', THEME_COLORS[id]);
        } catch (e) {
          // Corrupted storage, disabled localStorage (private mode), etc. -
          // fall through to the static ATELIER default above rather than
          // block paint.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/ninebeat-studio/icon.svg" />
    <link rel="apple-touch-icon" href="/ninebeat-studio/icon.svg" />
    <link rel="manifest" href="/ninebeat-studio/manifest.json" />
    <title>Ninebeat Studio — Hybrid Touch Workstation</title>
    <script type="module" crossorigin src="/ninebeat-studio/assets/index-CwqJXZVw.js"></script>
    <link rel="stylesheet" crossorigin href="/ninebeat-studio/assets/index-CfDjUO19.css">
  </head>
  <body class="h-full w-full overflow-hidden bg-hw-darkest text-hw-text touch-none">
    <div id="root" class="h-full w-full flex flex-col"></div>
  </body>
</html>
